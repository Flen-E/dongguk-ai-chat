<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f4f0" />
  <meta name="description" content="사주팔자 풀이 — 생년월일로 살펴보는 나의 기질과 운의 흐름" />
  <title>사주팔자 풀이</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="spark" viewBox="0 0 32 32"><path d="M17 3c1.2 8 3.5 10.3 11 12-7.5 1.7-9.8 4-11 12-1.3-8-3.6-10.3-11-12C13.4 13.3 15.7 11 17 3Z" fill="currentColor"/><path d="M5 2c.4 3 1.1 3.7 4 4-2.9.5-3.6 1.2-4 4-.4-2.8-1.1-3.5-4-4 2.9-.3 3.6-1 4-4Z" fill="currentColor"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>
  <main class="chat-window" aria-label="사주팔자 풀이 상담창">
    <header class="chat-header">
      <div class="identity"><span class="mini-avatar"><svg><use href="#spark"/></svg></span><div><h1>사주팔자 풀이</h1><span class="identity-note">나를 알아가는 작은 대화</span></div></div>
      <div class="header-actions"><span class="language">한국어</span><button id="resetButton" class="icon-button" type="button" aria-label="새 대화 시작" title="새 대화 시작"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5m-4-4a8 8 0 0 1 13-2l2 3M4 15l2 3a8 8 0 0 0 13-2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="minimizeButton" class="icon-button" type="button" aria-label="채팅창 닫기"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button></div>
    </header>
    <div class="chat-scroll" id="chatScroll">
      <section class="welcome" id="welcome">
        <div class="welcome-art" aria-hidden="true"><span class="art-orbit"></span><span class="art-dot"></span><span class="hero-avatar"><svg><use href="#spark"/></svg></span><span class="art-spark">✧</span></div>
        <span class="eyebrow">A LITTLE INSIGHT INTO YOU</span>
        <h2>당신의 이야기를<br />들려주세요.</h2>
        <p>타고난 기질부터 앞으로의 운의 흐름까지,<br />생년월일을 바탕으로 함께 풀어볼게요.</p>
        <span class="topic-label"><span></span> 생년월일 기반 사주 해석 · 운세 분석</span>
        <div class="suggestions"><h3><svg><use href="#spark"/></svg> 이런 질문으로 시작해보세요</h3>
          <button type="button" class="suggestion" data-prompt="1995년 10월 25일 오전 10시 양력 생일 사주를 풀이해 줘."><span class="suggestion-icon">☀</span><span><strong>나의 사주가 궁금해요</strong><small>1995년 10월 25일 오전 10시, 양력</small></span><svg><use href="#chevron"/></svg></button>
          <button type="button" class="suggestion" data-prompt="제 사주 원국을 분석해서 저에게 맞는 직업과 재물운을 알려주세요."><span class="suggestion-icon">◇</span><span><strong>어떤 일이 나와 잘 맞을까요?</strong><small>타고난 기질과 직업 · 재물운 알아보기</small></span><svg><use href="#chevron"/></svg></button>
          <button type="button" class="suggestion" data-prompt="1988년 3월 1일생인데 올해 운의 흐름과 실천 조언이 궁금해."><span class="suggestion-icon">✧</span><span><strong>올해의 흐름을 알고 싶어요</strong><small>1988년 3월 1일생의 올해 운세와 조언</small></span><svg><use href="#chevron"/></svg></button>
        </div>
      </section>
      <section id="messages" class="messages" aria-label="대화 내용" aria-live="polite" aria-relevant="additions"></section>
    </div>
    <footer class="chat-bottom">
      <p id="connectionNote" class="connection-note" hidden>디자인 미리보기입니다. 대화 서버 연결 전에는 <a href="https://aichat.dongguk.edu/public/chatbots/strange-leakey-arc" target="_blank" rel="noopener noreferrer">기존 챗봇에서 상담하기 ↗</a></p>
      <form id="chatForm" class="composer"><label class="sr-only" for="messageInput">메시지 입력</label><textarea id="messageInput" rows="1" maxlength="4000" placeholder="궁금한 내용을 편하게 물어보세요"></textarea><button id="sendButton" type="submit" aria-label="메시지 보내기" disabled><svg><use href="#arrow"/></svg></button></form>
      <div class="composer-note"><span>생년월일 · 태어난 시간 · 양력/음력을 알려주시면 좋아요</span><span>AI CHAT</span></div>
    </footer>
  </main>
  <button class="launcher" id="launcher" type="button" aria-label="사주팔자 풀이 채팅창 열기" hidden><svg><use href="#spark"/></svg><span>사주팔자 풀이</span></button>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
